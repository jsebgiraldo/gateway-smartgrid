global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scraping itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Edge gateway — prometheus-node-exporter-lua on OpenWrt (system metrics)
  # Listens on the WAN interface (eth0). Firewall rule
  # "Allow-Prometheus-NodeExporter" on the edge permits 192.168.8.0/24 → :9100.
  - job_name: edge-node
    static_configs:
      - targets: ['192.168.8.175:9100']
        labels:
          host: r1000-wm6108-a3dd      # was 'device' — collided with lua-exporter's per-interface device label
          role: edge-gateway
          site: unal

  # Upstream router — prometheus-node-exporter-lua on the GL-MT6000
  - job_name: router-node
    static_configs:
      - targets: ['192.168.8.1:9100']
        labels:
          host: GL-MT6000
          role: router
          site: unal

  # Central ThingsBoard CE — Spring Boot actuator (services/thingsboard/).
  # Runs in a sibling compose project on this host; reach it via the
  # Docker Desktop host gateway.
  - job_name: central-thingsboard
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: thingsboard-ce
          role: central-server
          application: thingsboard-ce   # so JVM Micrometer dashboards (filter by 'application') pick it up

  # Edge ThingsBoard Edge — actuator metrics. UP only once the edge's
  # tb-edge container is reconnected to the central with METRICS_ENABLED
  # and a firewall rule for :8090. See services/tb-edge/.
  - job_name: edge-tb-edge
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['192.168.8.175:8090']
        labels:
          service: tb-edge
          role: edge-application
          host: r1000-wm6108-a3dd
          application: tb-edge          # so JVM Micrometer dashboards (filter by 'application') pick it up

  # Raspberry Pi 4 — the production edge (OTBR + LwM2M)
  - job_name: pi4-node
    static_configs:
      - targets: ['192.168.8.111:9100']
        labels:
          host: pi4-ekh01
          role: edge-gateway-prod
          site: unal

  - job_name: pi4-tb-edge
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['192.168.8.111:8090']
        labels:
          service: tb-edge
          role: edge-application-prod
          host: pi4-ekh01
          application: pi4-tb-edge

  # OpenThread / IEEE 802.15.4 mesh — custom exporter that shells out to
  # `ot-ctl` on the WSL OTBR (services/observability/thread-exporter/).
  # Runs as a systemd service in WSL on :9101; reach it via the Docker Desktop
  # host gateway (WSL is in mirrored networking, so the port is on the host).
  - job_name: thread-mesh
    static_configs:
      - targets: ['host.docker.internal:9101']
        labels:
          service: otbr
          role: thread-border-router
          site: unal-lab
          network: GatewaySmartGrid
